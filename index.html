<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACI Canteen Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            boxShadow: {
              'glow-indigo': '0 0 0 1px rgba(99,102,241,0.15), 0 8px 30px -8px rgba(99,102,241,0.35)',
              'glow-violet': '0 0 0 1px rgba(139,92,246,0.15), 0 8px 30px -8px rgba(139,92,246,0.35)',
              'soft': '0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -8px rgba(15,23,42,0.08)',
              'soft-lg': '0 2px 4px rgba(15,23,42,0.04), 0 20px 40px -12px rgba(15,23,42,0.12)',
              'inner-border': 'inset 0 0 0 1px rgba(148,163,184,0.12)',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              gridPan: {
                '0%': { backgroundPosition: '0 0' },
                '100%': { backgroundPosition: '60px 60px' },
              },
              blink: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0.3 },
              },
            },
            animation: {
              shimmer: 'shimmer 3s linear infinite',
              float: 'float 6s ease-in-out infinite',
              'grid-pan': 'gridPan 30s linear infinite',
              blink: 'blink 1.6s ease-in-out infinite',
            },
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'ss01';
      }

      :root {
        --grid-color: rgba(15,23,42,0.06);
        --dot-color: rgba(15,23,42,0.08);
      }
      .dark {
        --grid-color: rgba(148,163,184,0.06);
        --dot-color: rgba(148,163,184,0.10);
      }

      /* Numbers use tabular figures for perfect alignment */
      .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

      /* App shell with layered ambient glow */
      .app-shell-bg {
        background:
          radial-gradient(1400px 700px at 100% -10%, rgba(99,102,241,0.10), transparent 55%),
          radial-gradient(900px 500px at -10% 100%, rgba(139,92,246,0.08), transparent 60%),
          radial-gradient(700px 400px at 50% 120%, rgba(236,72,153,0.05), transparent 60%),
          linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        position: relative;
      }
      .dark .app-shell-bg {
        background:
          radial-gradient(1400px 700px at 100% -10%, rgba(99,102,241,0.16), transparent 55%),
          radial-gradient(900px 500px at -10% 100%, rgba(139,92,246,0.12), transparent 60%),
          radial-gradient(700px 400px at 50% 120%, rgba(236,72,153,0.08), transparent 60%),
          linear-gradient(180deg, #060a17 0%, #0a0f22 100%);
      }
      /* Subtle dot pattern overlay */
      .app-shell-bg::before {
        content: '';
        position: absolute; inset: 0;
        background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
        background-size: 22px 22px;
        pointer-events: none;
        mask-image: radial-gradient(ellipse at top, black 20%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at top, black 20%, transparent 80%);
        opacity: 0.7;
      }

      /* Sidebar background — deep navy, layered */
      .sidebar-bg {
        background:
          radial-gradient(400px 200px at 50% 0%, rgba(99,102,241,0.18), transparent 70%),
          linear-gradient(180deg, #08091a 0%, #05060f 100%);
      }
      .sidebar-bg::after {
        content: '';
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 18px 18px;
        pointer-events: none;
        opacity: 0.6;
      }

      /* Scrollbar */
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.25); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
      *::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.45); }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

      /* Animations */
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes fadeInScale { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
      .animate-fade-scale { animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* Gradient text */
      .text-gradient-brand {
        background: linear-gradient(135deg, #818cf8 0%, #a78bfa 40%, #f0abfc 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .text-gradient-mesh {
        background: linear-gradient(120deg, #0f172a 0%, #334155 60%, #6366f1 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .dark .text-gradient-mesh {
        background: linear-gradient(120deg, #f8fafc 0%, #cbd5e1 55%, #c4b5fd 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      /* Glass */
      .glass {
        background: rgba(255,255,255,0.75);
        backdrop-filter: saturate(160%) blur(14px);
        -webkit-backdrop-filter: saturate(160%) blur(14px);
      }
      .dark .glass { background: rgba(10,15,32,0.55); }

      /* Panel — the primary card surface. Sharp, quiet, layered. */
      .panel {
        background: rgba(255,255,255,0.7);
        backdrop-filter: saturate(160%) blur(14px);
        -webkit-backdrop-filter: saturate(160%) blur(14px);
        border: 1px solid rgba(148,163,184,0.18);
        border-radius: 20px;
        box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(15,23,42,0.04), 0 12px 32px -12px rgba(15,23,42,0.08);
      }
      .dark .panel {
        background: rgba(10,15,32,0.55);
        border-color: rgba(148,163,184,0.10);
        box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 40px -20px rgba(0,0,0,0.6);
      }

      /* Chip */
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 999px;
        font-size: 11px; font-weight: 600; line-height: 1;
        background: rgba(148,163,184,0.10);
        color: rgb(51,65,85);
        border: 1px solid rgba(148,163,184,0.16);
      }
      .dark .chip {
        background: rgba(148,163,184,0.08);
        color: rgb(203,213,225);
        border-color: rgba(148,163,184,0.14);
      }

      /* Keyboard hint */
      .kbd {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 18px; height: 18px; padding: 0 5px;
        font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        color: rgb(100,116,139);
        background: rgba(148,163,184,0.15);
        border: 1px solid rgba(148,163,184,0.25);
        border-bottom-width: 2px;
        border-radius: 5px;
      }
      .dark .kbd {
        color: rgb(148,163,184);
        background: rgba(148,163,184,0.08);
        border-color: rgba(148,163,184,0.18);
      }

      /* Focus */
      *:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.4); border-radius: 8px; }

      /* Shimmer skeleton */
      .shimmer {
        background: linear-gradient(90deg, rgba(148,163,184,0.08) 0%, rgba(148,163,184,0.18) 50%, rgba(148,163,184,0.08) 100%);
        background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
      }

      /* Section rule with fade */
      .rule {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(148,163,184,0.25), transparent);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.0"
  }
}
</script>
</head>
  <body class="app-shell-bg text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
