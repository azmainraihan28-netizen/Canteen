<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACI Canteen Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            },
            boxShadow: {
              'glow-indigo': '0 0 0 1px rgba(99,102,241,0.15), 0 8px 30px -8px rgba(99,102,241,0.35)',
              'glow-violet': '0 0 0 1px rgba(139,92,246,0.15), 0 8px 30px -8px rgba(139,92,246,0.35)',
              'soft': '0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -8px rgba(15,23,42,0.08)',
              'soft-lg': '0 2px 4px rgba(15,23,42,0.04), 0 20px 40px -12px rgba(15,23,42,0.12)',
            },
            backgroundImage: {
              'grid-slate': "linear-gradient(rgba(148,163,184,0.08) 1px, transparent 1px), linear-gradient(to right, rgba(148,163,184,0.08) 1px, transparent 1px)",
              'radial-glow': 'radial-gradient(ellipse at top, rgba(99,102,241,0.15), transparent 60%)',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
            },
            animation: {
              shimmer: 'shimmer 3s linear infinite',
              float: 'float 6s ease-in-out infinite',
            },
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      }

      /* App background — light mode: soft warm gradient; dark mode: deep slate with radial glow */
      .app-shell-bg {
        background:
          radial-gradient(1200px 600px at 100% -10%, rgba(99,102,241,0.08), transparent 60%),
          radial-gradient(900px 500px at -10% 100%, rgba(139,92,246,0.06), transparent 60%),
          linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      }
      .dark .app-shell-bg {
        background:
          radial-gradient(1200px 600px at 100% -10%, rgba(99,102,241,0.18), transparent 60%),
          radial-gradient(900px 500px at -10% 100%, rgba(139,92,246,0.12), transparent 60%),
          linear-gradient(180deg, #0b1120 0%, #0f172a 100%);
      }

      /* Sidebar background — deep navy with subtle noise */
      .sidebar-bg {
        background:
          linear-gradient(180deg, #0b1226 0%, #0a0f1f 100%);
      }

      /* Scrollbar (global, subtle) */
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.25); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
      *::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.45); border: 2px solid transparent; background-clip: padding-box; }

      /* Sidebar-specific slim scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; border: none; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-scale { animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* Gradient text helper */
      .text-gradient-brand {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Glass card */
      .glass {
        background: rgba(255,255,255,0.7);
        backdrop-filter: saturate(140%) blur(10px);
        -webkit-backdrop-filter: saturate(140%) blur(10px);
      }
      .dark .glass {
        background: rgba(15,23,42,0.55);
      }

      /* Focus ring override for a softer look */
      *:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(99,102,241,0.35);
        border-radius: 8px;
      }

      /* Shimmering skeleton */
      .shimmer {
        background: linear-gradient(90deg, rgba(148,163,184,0.08) 0%, rgba(148,163,184,0.18) 50%, rgba(148,163,184,0.08) 100%);
        background-size: 200% 100%;
        animation: shimmer 1.6s linear infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.0"
  }
}
</script>
</head>
  <body class="app-shell-bg text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
